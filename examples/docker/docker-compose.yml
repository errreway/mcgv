services:
  ignite_0:
    image: apacheignite/ignite:2.16.0
    ports:
      - 10800:10800
    restart: always
    environment:
      CONFIG_URI: file:/config/ignite-config.xml
      JVM_OPTS: -Xms4G -Xmx4G -XX:+UseG1GC
      USER_LIBS: /user_libs/client-test-0.0.1-SNAPSHOT.jar
    volumes:
      - ./config:/config:ro
      - ../../internal/testing/java/target/:/user_libs:ro
    network_mode: host

  ignite_1:
    image: apacheignite/ignite:2.16.0
    ports:
      - 10800:10801
    restart: always
    environment:
      CONFIG_URI: file:/config/ignite-config.xml
      JVM_OPTS: -Xms4G -Xmx4G -XX:+UseG1GC
      USER_LIBS: /user_libs/client-test-0.0.1-SNAPSHOT.jar
    volumes:
      - ./config:/config:ro
      - ../../internal/testing/java/target/:/user_libs:ro
    network_mode: host

  ignite_2:
